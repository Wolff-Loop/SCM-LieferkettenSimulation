<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Weltkarte</title>
  <link rel="stylesheet" href="leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; background: #F3F1EE; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="leaflet.js"></script>
  <script src="world.js"></script>
  <script>
    // Bruecke zu Python (QWebChannel). Ohne Kanal bleibt die Karte trotzdem nutzbar.
    var bridge = null;
    if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined') {
      new QWebChannel(qt.webChannelTransport, function (channel) {
        bridge = channel.objects.bridge;
      });
    }
    function melde(art, id) {
      if (bridge) { bridge.on_map_click(art, id); }
    }

    // Karte ohne Online-Kacheln: Laenderflaechen aus world.js (offline lauffaehig)
    var map = L.map('map', { minZoom: 1, maxZoom: 8, worldCopyJump: true })
      .setView([30, 15], 2);
    L.geoJSON(WORLD, {
      style: { color: '#FFFFFF', weight: 0.6, fillColor: '#E8E3DC', fillOpacity: 1 },
      onEachFeature: function (feature, layer) {
        layer.bindTooltip(feature.properties.name, { sticky: true });
        layer.on('click', function () { melde('country', feature.properties.name); });
        layer.on('mouseover', function () { layer.setStyle({ fillColor: '#D9D2C7' }); });
        layer.on('mouseout', function () { layer.setStyle({ fillColor: '#E8E3DC' }); });
      }
    }).addTo(map);

    var nodeLayer = L.layerGroup().addTo(map);
    var routeLayer = L.layerGroup().addTo(map);

    // Wird von Python aufgerufen: nodes = [{id, name, lat, lon, color}, ...]
    function setNodes(nodes) {
      nodeLayer.clearLayers();
      nodes.forEach(function (n) {
        var m = L.circleMarker([n.lat, n.lon], {
          radius: 6, color: '#2E2C2A', weight: 1,
          fillColor: n.color, fillOpacity: 1
        }).bindTooltip(n.name + ' (' + n.typ + ')').addTo(nodeLayer);
        m.on('click', function () { melde('node', n.id || n.name); });
      });
    }

    // coords = [[lat, lon], ...], color = '#rrggbb'
    function drawRoute(coords, color) {
      L.polyline(coords, { color: color, weight: 3 }).addTo(routeLayer);
    }

    function clearRoutes() { routeLayer.clearLayers(); }
  </script>
</body>
</html>
